# Minecraft server properties
# Sat Mar 28 20:27:15 GMT-03:00 2026

# --- Core Gameplay ---
gamemode=survival
difficulty=normal
hardcore=false

pvp=true
force-gamemode=false

# --- World Generation ---
level-name=world
level-seed=
level-type=minecraft:normal
generate-structures=true

# --- Online / Authentication ---
online-mode=false
enforce-secure-profile=true

# --- Networking ---
server-ip=
server-port=25565

motd=Horror Minecraft Server
max-players=5

network-compression-threshold=256
use-native-transport=true

# --- Performance Tuning ---
view-distance=8
simulation-distance=6
max-tick-time=60000
sync-chunk-writes=true
max-chained-neighbor-updates=1000000

# --- Mob Spawning ---
spawn-monsters=true
spawn-animals=true
spawn-npcs=true

# --- Spawn Protection ---
spawn-protection=16

# --- Entity / Visibility ---
entity-broadcast-range-percentage=75

# --- Player / Session ---
player-idle-timeout=0
hide-online-players=false

# --- Commands & Permissions ---
enable-command-block=false
op-permission-level=4
function-permission-level=2

# --- RCON (Remote Console) ---
enable-rcon=false
rcon.password=
rcon.port=25575

# --- Query (Server Info Query Protocol) ---
enable-query=false
query.port=

# --- Security & Access ---
white-list=false
enforce-whitelist=false
prevent-proxy-connections=false

# --- Misc ---
allow-flight=false
allow-nether=true
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
enable-status=true
rate-limit=0

# --- Resource Packs ---
require-resource-pack=false
resource-pack=
resource-pack-sha1=
resource-pack-prompt=

# --- Packs ---
initial-enabled-packs=vanilla
initial-disabled-packs=

# --- Misc Advanced ---
max-world-size=29999984
generator-settings={}
