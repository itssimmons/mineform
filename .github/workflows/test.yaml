name: Test Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: Run tests
        run: |
          echo <<EOF
          TEST 1 ....................... RUNNING
          TEST 1 ....................... PASSED
          TEST 2 ....................... RUNNING
          TEST 2 ....................... PASSED
          TEST 3 ....................... RUNNING
          TEST 3 ....................... PASSED
          EOF
          
      - name: Test results
        run: |
          echo "All tests passed successfully!"
